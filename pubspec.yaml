name: core_barrage
description: "Core Barrage - A casual tactical action game"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.38.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/player/blue_soldier.png
    - assets/images/player/run/blue_soldier_run.png
    - assets/images/enemies/basic/red_enemy_run.png
    - assets/images/bosses/level_1/boss_run.png
    - assets/images/environment/battlefield/battlefield_01.png
    - assets/images/player/vehicle/blue_vehicle.png
    - assets/images/effects/combat/muzzle_flash.png